<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>blog</title>
        
        <style>
            /* Centralização e estilo básico do corpo para melhor visualização */
            body {
                background-color: #f0f2f5;
                font-family: sans-serif;
                margin: 20px;
            }

            header {
                background-color: #183C63;
                color: #FFFFFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 20px;
                border-radius: 8px 8px 0 0; /* Bordas arredondadas no topo */
            }

            main {
                background-color: #FFFFFF;
                color: #183C63;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 20px;
                border-radius: 0 0 8px 8px; /* Bordas arredondadas na base */
                box-shadow: 0 4px 6px rgba(0,0,0,0.1); /* Sombra leve para destacar o container */
            }

            /* Classe criada especificamente para ajustar a imagem do post */
            .imagem-post {
                max-width: 100%; /* Garante que a imagem não ultrapasse a largura da tela/container */
                height: auto; /* Mantém a proporção original da imagem */
                border-radius: 8px; /* Cantos arredondados para um design mais limpo */
                margin: 20px 0; /* Espaçamento para não colar no texto */
            }
        </style>
    </head>
    <body>
        <header>
            <h1>BLOG SEXO DOS ANJOS</h1>
            <p>Esse blog discutirá temas aleatórios</p>
        </header>

        <main>
            <h2>Meu primeiro post: por que os estudantes tomam café na sala</h2>
            <p>O que faz com que estudantes do ensino médio tomem "café" na sala de aula ao invés do horário do café</p>
            
            <!-- Imagem inserida com alt descritivo conectando à ideia do texto -->
            <img 
                src="https://images.unsplash.com/photo-1555529771-835f59bfc50c?auto=format&fit=crop&w=600&q=80" 
                alt="Xícara de café quente apoiada sobre cadernos e materiais de estudo, representando o hábito de estudantes trazerem café para a sala de aula na tentativa de driblar o sono e manter o foco." 
                class="imagem-post"
            >
        </main>
    </body>
</html>
